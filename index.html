<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استمارة تفاصيل وتصميم أزياء التخرج</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7A5548;
      --primary-light: #F4EBE6;
      --accent: #A1786A;
      --bg: #FAF7F5;
      --card-bg: #FFFFFF;
      --text: #2C2523;
      --text-muted: #6E625F;
      --border: #D8C7BF;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 25px 15px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(122, 85, 72, 0.08);
      padding: 30px;
    }

    /* الترويسة */
    .header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--primary-light);
    }
    .header h1 {
      color: var(--primary);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 5px;
    }

    /* البطاقات والأقسام */
    .card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .card-title {
      background: var(--primary);
      color: #FFFFFF;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 700;
    }

    .card-body {
      padding: 18px;
    }

    /* شبكة الحقول الأساسية */
    .grid-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    .input-group input, .input-group textarea {
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus, .input-group textarea:focus {
      border-color: var(--primary);
      background: #FFF;
      box-shadow: 0 0 0 3px rgba(122, 85, 72, 0.15);
    }

    /* صفوف الخيارات المتعددة */
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .option-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .option-label {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
      min-width: 120px;
    }

    .radio-group {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      cursor: pointer;
    }

    .radio-item input[type="radio"] {
      accent-color: var(--primary);
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    /* حقول مدمجة للتطريز والقياس */
    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-row label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--primary);
      min-width: 160px;
    }

    .detail-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13.5px;
      background: var(--bg);
      outline: none;
    }

    .detail-row input:focus {
      background: #FFF;
      border-color: var(--primary);
    }

    /* أزرار الإجراءات */
    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-print {
      background: var(--primary);
      color: #FFF;
    }

    .btn-print:hover {
      background: #644439;
      transform: translateY(-1px);
    }

    .btn-reset {
      background: var(--primary-light);
      color: var(--primary);
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .form-container {
        border: none;
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
      .actions {
        display: none;
      }
      .card {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    
    <!-- الترويسة -->
    <div class="header">
      <h1>🎓 فن وتصميم لأزياء التخرج</h1>
      <p>استمارة تثبيت وتفاصيل حجز أزياء التخرج وملحقاتها</p>
    </div>

    <!-- 1. معلومات الطالب -->
    <div class="card">
      <div class="card-title">معلومات الطالب</div>
      <div class="card-body">
        <div class="grid-fields">
          <div class="input-group">
            <label>اسم الطالب الكامل:</label>
            <input type="text" placeholder="اكتب الاسم الرباعي">
          </div>
          <div class="input-group">
            <label>القسم / الكلية:</label>
            <input type="text" placeholder="مثلاً: علوم الحاسوب / هندسة...">
          </div>
          <div class="input-group">
            <label>رقم الهاتف (واتساب):</label>
            <input type="tel" placeholder="07XXXXXXXXX">
          </div>
        </div>
      </div>
    </div>

    <!-- 2. نوع التجهيز والموديلات -->
    <div class="card">
      <div class="card-title">نوع التجهيز وتفاصيل الموديل</div>
      <div class="card-body">
        <div class="option-row">
          <span class="option-label">نوع التجهيز:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="pkg" checked> بكج كامل</label>
            <label class="radio-item"><input type="radio" name="pkg"> قطعة مفردة</label>
          </div>
        </div>

        <div class="option-row">
          <span class="option-label">نوع الروب:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="gown" checked> عادي</label>
            <label class="radio-item"><input type="radio" name="gown"> ملكي</label>
            <label class="radio-item"><input type="radio" name="gown"> خليجي</label>
            <label class="radio-item"><input type="radio" name="gown"> أمريكي</label>
          </div>
        </div>

        <div class="option-row">
          <span class="option-label">نوع الوشاح:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="sash" checked> عادي</label>
            <label class="radio-item"><input type="radio" name="sash"> ملكي</label>
            <label class="radio-item"><input type="radio" name="sash"> جانبي</label>
            <label class="radio-item"><input type="radio" name="sash"> أمريكي</label>
          </div>
        </div>

        <div class="option-row">
          <span class="option-label">نوع القبعة:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="cap" checked> عادي</label>
            <label class="radio-item"><input type="radio" name="cap"> ملكي</label>
            <label class="radio-item"><input type="radio" name="cap"> تولسيدو</label>
          </div>
        </div>

        <div class="option-row">
          <span class="option-label">ظهر الوشاح الملكي:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="sash_back"> سداسي</label>
            <label class="radio-item"><input type="radio" name="sash_back"> بيضوي</label>
            <label class="radio-item"><input type="radio" name="sash_back" checked> مثلث كبير</label>
            <label class="radio-item"><input type="radio" name="sash_back"> مثلث صغير</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. القياسات والإضافات -->
    <div class="card">
      <div class="card-title">القياسات وإضافات الروب والقبعة</div>
      <div class="card-body">
        <div class="detail-row">
          <label>إضافات الروب:</label>
          <input type="text" placeholder="مثال: تطعيم خط واحد...">
        </div>
        <div class="detail-row">
          <label>قياس وطول الروب:</label>
          <input type="text" placeholder="مثال: قياس M / الطول 125 سم...">
        </div>
        <div class="detail-row">
          <label>إضافات القبعة:</label>
          <input type="text" placeholder="اكتب إن وجدت أو (لا يوجد)">
        </div>

        <div class="option-row" style="margin-top: 10px;">
          <span class="option-label">كركوشة القبعة:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="tassel" checked> جانبي</label>
            <label class="radio-item"><input type="radio" name="tassel"> من فوق</label>
          </div>
        </div>

        <div class="option-row">
          <span class="option-label">إطار حواف الوشاح:</span>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="border_add" checked> اي</label>
            <label class="radio-item"><input type="radio" name="border_add"> لا</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. تفاصيل التطريز -->
    <div class="card">
      <div class="card-title">تفاصيل التطريز</div>
      <div class="card-body">
        <div class="detail-row">
          <label>الجهة اليمنى للوشاح:</label>
          <input type="text" placeholder="النص المطلوب تطريزه على اليمين">
        </div>
        <div class="detail-row">
          <label>الجهة اليسرى للوشاح:</label>
          <input type="text" placeholder="النص أو الشعار المطلوب تطريزه على اليسار">
        </div>
        <div class="detail-row">
          <label>ظهر الوشاح:</label>
          <input type="text" placeholder="الكتابة أو الرسمة على الظهر">
        </div>
        <div class="detail-row">
          <label>تطريز القبعة (الجانبي):</label>
          <input type="text" placeholder="الاسم أو السنة">
        </div>
        <div class="detail-row">
          <label>تطريز القبعة (من الأعلى):</label>
          <input type="text" placeholder="التطريز على المربع العلوي إن وجد">
        </div>
      </div>
    </div>

    <!-- 5. ملاحظات وتصميم خاص -->
    <div class="card">
      <div class="card-title">ملاحظات وتصميم خاص</div>
      <div class="card-body">
        <div class="detail-row">
          <label>ملاحظات إضافية للتنفيذ:</label>
          <input type="text" placeholder="أي تفاصيل أو ملاحظات خاصة بالقصة أو التصميم...">
        </div>
      </div>
    </div>

    <!-- أزرار الإجراءات -->
    <div class="actions">
      <button class="btn btn-print" onclick="window.print()">🖨️ طباعة الاستمارة / حفظ كـ PDF</button>
      <button class="btn btn-reset" onclick="document.querySelectorAll('input[type=text], input[type=tel]').forEach(i => i.value='')">مسح الحقول</button>
    </div>

  </div>

</body>
</html>
